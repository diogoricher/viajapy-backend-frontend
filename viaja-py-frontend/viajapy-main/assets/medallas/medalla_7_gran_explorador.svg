<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="gran-grad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <filter id="corona-shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#78350F" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Laureles de victoria -->
  <circle cx="80" cy="80" r="70" fill="url(#gran-grad)" filter="url(#corona-shadow)" stroke="#78350F" stroke-width="4"/>
  <circle cx="80" cy="80" r="58" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <!-- Corona dorada -->
  <polygon points="54,98 54,64 68,76 80,52 92,76 106,64 106,98" fill="#EAB308" stroke="#78350F" stroke-width="2"/>
  <rect x="54" y="96" width="52" height="8" rx="2" fill="#CA8A04" stroke="#78350F" stroke-width="1.5"/>
  <!-- Joyas en la corona -->
  <circle cx="80" cy="52" r="3.5" fill="#EF4444" stroke="#78350F" stroke-width="1"/>
  <circle cx="68" cy="76" r="3" fill="#3B82F6" stroke="#78350F" stroke-width="1"/>
  <circle cx="92" cy="76" r="3" fill="#10B981" stroke="#78350F" stroke-width="1"/>
  <!-- Estrellas de gloria -->
  <polygon points="80,110 82,114 86,114 83,117 84,121 80,119 76,121 77,117 74,114 78,114" fill="#78350F"/>
</svg>